name: Sync badges & publish site

on:
  push:
    branches: [main]
    paths:
      - "AI_Resource_Matrix.md"
      - "scripts/**"
      - ".github/workflows/matrix.yml"
  schedule:
    # Weekly sweep to catch repos that were renamed, transferred, or deleted.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: matrix-sync
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync star badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-star-badges.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No badge changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_Resource_Matrix.md
          git commit -m "chore: sync star badges [skip ci]"
          git push

  publish:
    needs: badges
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out main by name so we pick up any commit the badges job just pushed,
      # rather than the SHA that triggered this run.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build site
        run: node scripts/build-site.mjs AI_Resource_Matrix.md site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
